        <p>
            O polvo dumbo (Grimpoteuthis) é um molusco que vive entre 1000 a 7000 metros de profundidade.
             Diferente de outros polvos, não possui glândula de tinta, pois vive a uma profundidade
             onde a luz do sol não alcança, o que tornaria isso inútil.
